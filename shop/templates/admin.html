{{define "content"}}
<p><a class="button" href="/admin/new">Добавить товар</a></p>
<table>
  <tr><th>Название</th><th>Категория</th><th>Цена</th><th>Количество</th><th></th></tr>
  {{range .Data}}
  <tr>
    <td>{{.Name}}</td>
    <td>{{.Category}}</td>
    <td>{{.Price}} руб.</td>
    <td>
      <form method="post" action="/admin/{{.ID}}/stock" class="inline">
        <input type="number" name="stock" value="{{.Stock}}" min="0" class="short">
        <button class="button small">Сохранить</button>
      </form>
    </td>
    <td>
      <form method="post" action="/admin/{{.ID}}/delete" class="inline" onsubmit="return confirm('Удалить товар?')">
        <button class="button small danger">Удалить</button>
      </form>
    </td>
  </tr>
  {{end}}
</table>
{{end}}
